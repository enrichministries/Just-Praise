<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f8f9fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }
        h1 {
            font-size: 2.5em;
            margin: 0 0 10px 0;
            color: #2c3e50;
        }
        .subtitle {
            font-size: 1.2em;
            color: #7f8c8d;
            margin: 0;
        }
        .embed-container {
            position: relative;
            width: 100%;
            max-width: 700px;
            height: 0;
            padding-bottom: 64.29%; /* 450/700 ≈ 0.6429 */
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 12px;
        }
        footer {
            margin-top: 40px;
            text-align: center;
            color: #95a5a6;
            font-size: 0.9em;
        }
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>100 Praises from the Bible</h1>
        <p class="subtitle">A Celebration of God's Glory and Goodness</p>
    </header>
    <div class="embed-container">
        <iframe 
            src="https://gamma.app/embed/xa8rrjifeutvv4o" 
            allow="fullscreen"
            title="100 Praises from the Bible: A Celebration of God's Glory and Goodness">
        </iframe>
    </div>
    <footer>
        <p>Hosted on GitHub Pages for your worship and devotional use. &copy; 2026 Sunny Prasad</p>
    </footer>
</body>
</html>
